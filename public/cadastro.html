<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>YouTube - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card auth-card" style="max-width: 600px;">
        <h1>YouTube</h1>
        <h2>Criar Conta</h2>
        <form class="form-grid" onsubmit="event.preventDefault(); cadastrarUsuario();">
            <div><label>Nome:</label><input type="text" id="nome" required></div>
            <div><label>Sobrenome:</label><input type="text" id="sobrenome" required></div>
            <div><label>CPF:</label><input type="text" id="cpf" required></div>
            <div><label>Telefone:</label><input type="text" id="telefone" required></div>
            <div class="full-width"><label>E-mail:</label><input type="email" id="email" required></div>
            <div class="full-width"><label>Senha:</label><input type="password" id="senha" required></div>
            <div><label>Rua:</label><input type="text" id="rua" required></div>
            <div><label>CEP:</label><input type="text" id="cep" required></div>
            <div><label>Cidade:</label><input type="text" id="cidade" required></div>
            <div><label>Estado (UF):</label><input type="text" id="estado" maxlength="2" required></div>
            <div class="full-width"><button type="submit">Cadastrar</button></div>
        </form>
        <a href="login.html" style="display: block; margin-top: 20px;">Já tem conta? Voltar ao Login</a>
    </div>
    <script src="cadastro.js"></script>
</body>
</html>
