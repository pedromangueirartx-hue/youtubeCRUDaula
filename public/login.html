<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>YouTube - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card auth-card">
        <h1>YouTube</h1>
        <h2>Fazer Login</h2>
        <form onsubmit="event.preventDefault(); fazerLogin();">
            <div><label>E-mail:</label><input type="email" id="email" required></div>
            <div><label>Senha:</label><input type="password" id="senha" required></div>
            <button type="submit">Entrar</button>
        </form>
        <a href="cadastro.html" style="display: block; margin-top: 20px;">Não tem uma conta? Cadastre-se aqui.</a>
    </div>
    <script src="login.js"></script>
</body>
</html>
